# Mirrors the skills from the sources in sources/ and pushes the result straight
# to main, without a pull request. DCP-Rosetta starts it on every push to its
# main (.github/workflows/mirror-skills.yml there, which sends a
# repository_dispatch); the daily run catches a dispatch that went missing.
# With nothing new upstream the sync changes nothing, and nothing is pushed.
#
# A push made with GITHUB_TOKEN does not trigger checks.yml, so this job runs
# the same checks first: a sync that fails them pushes nothing, and the failed
# run shows which skill to fix upstream.

name: Sync

on:
  repository_dispatch:
    types: [rosetta-push]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A newer run syncs the latest upstream anyway, so it replaces an older one.
concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Mirror the skills
        run: uv run -q scripts/sync.py --summary "$RUNNER_TEMP/summary.md"

      - name: skills/ matches skills.lock.json
        run: make lock
      - name: Skills follow the Agent Skills specification
        run: make spec
      - name: Internal links and anchors resolve
        id: links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments 'README.md' 'CONTRIBUTING.md' 'skills/**/*.md'
          # Outside the checkout, or the commit below would include the report.
          output: ${{ runner.temp }}/lychee.md
          jobSummary: false
          fail: true
      - name: Write the link check report
        if: ${{ !cancelled() && steps.links.outcome != 'skipped' }}
        run: scripts/link-report.sh internal "$RUNNER_TEMP/lychee.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push the changes to main
        run: |
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new upstream."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -F "$RUNNER_TEMP/summary.md"
          git push origin HEAD:main
