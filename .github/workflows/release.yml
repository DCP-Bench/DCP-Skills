# Cuts a catalog release by hand: tags the current main as vYYYY.MM.N and
# publishes a GitHub release listing the skills added, changed and removed since
# the previous one. Fails, creating nothing, when nothing changed.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: The release is what the last sync wrote
        run: make lock
      - name: Name the release and write its notes
        id: release
        run: echo "tag=$(uv run -q scripts/release.py --notes "$RUNNER_TEMP/notes.md")" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
