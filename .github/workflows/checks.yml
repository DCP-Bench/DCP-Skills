# Gates every pull request and push to main: skills/ must be exactly what the
# last sync wrote, every skill must follow the Agent Skills specification, and
# internal links and anchors must resolve. External links are checked weekly
# by links.yml instead, because they fail for reasons outside a PR.

name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: skills/ matches skills.lock.json
        run: make lock
      - name: Skills follow the Agent Skills specification
        run: make spec

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Internal links and anchors resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments 'README.md' 'CONTRIBUTING.md' 'skills/**/*.md'
          fail: true
